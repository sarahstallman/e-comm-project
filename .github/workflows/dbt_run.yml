name: dbt_integration_pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run_and_test_dbt:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Install Python 3.11 Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies & dbt
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake python-dotenv

      # === FIX: Generate a temporary matching profiles.yml for the cloud server ===
      - name: 4. Populate Mock dbt Profile Configuration
        working-directory: ./ecomm_analytics
        run: |
          mkdir -p .dbt
          cat <<EOF > profiles.yml
          ecomm_analytics:
            outputs:
              dev:
                type: snowflake
                account: "{{ env_var('SF_ACCOUNT') }}"
                user: "{{ env_var('SF_USER') }}"
                password: "{{ env_var('SF_PASSWORD') }}"
                role: "{{ env_var('SF_ROLE') }}"
                warehouse: "{{ env_var('SF_WAREHOUSE') }}"
                database: "{{ env_var('SF_DATABASE') }}"
                schema: "{{ env_var('SF_SCHEMA') }}"
                threads: 4
                client_session_keep_alive: False
            target: dev
          EOF

      - name: 5. Execute dbt Compile & Test Suite
        working-directory: ./ecomm_analytics
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USER: ${{ secrets.SF_USER }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_ROLE: ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
          SF_SCHEMA: ${{ secrets.SF_SCHEMA }}
        # We append --profiles-dir . to explicitly point dbt to the newly created file
        run: |
          dbt deps
          dbt debug --profiles-dir .
          dbt run --profiles-dir .
          dbt test --profiles-dir .
